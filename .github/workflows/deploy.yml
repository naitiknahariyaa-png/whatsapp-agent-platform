name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/whatsapp-agent:latest

      - name: Build and push bridge image
        uses: docker/build-push-action@v6
        with:
          context: ./whatsapp-bridge
          file: ./whatsapp-bridge/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/whatsapp-bridge:latest

  deploy:
    name: Deploy (stub)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Smoke-test compose file
        run: docker compose -f docker-compose.yml config
      - name: Deploy placeholder
        run: echo "Add your platform-specific deploy step here (Railway / Fly / k8s)."
