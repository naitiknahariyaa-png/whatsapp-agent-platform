<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Leads</title>
  <style>body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:20px} table{width:100%;border-collapse:collapse} th,td{border:1px solid #ddd;padding:8px;text-align:left} .controls{margin-bottom:12px}</style>
</head>
<body>
  <h2>Leads</h2>
  <div class="controls">
    <select id="filterStatus"><option value="">All</option><option value="new">New</option><option value="contacted">Contacted</option><option value="qualified">Qualified</option><option value="converted">Converted</option><option value="lost">Lost</option></select>
    <button id="refreshLeads">Refresh</button>
    <button id="openCreate">Create Lead</button>
  </div>

  <table id="leadsTable">
    <thead><tr><th>ID</th><th>Phone</th><th>Name</th><th>Score</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody></tbody>
  </table>

  <div id="createModal" style="display:none;margin-top:12px">
    <h3>Create Lead</h3>
    <input id="cPhone" placeholder="phone" />
    <input id="cName" placeholder="name" />
    <select id="cSource"><option value="manual">manual</option><option value="meta_ad">meta_ad</option></select>
    <button id="createLeadBtn">Create</button>
    <button id="closeCreate">Close</button>
    <div id="createMsg" class="small"></div>
  </div>

  <script src="/js/leads.js"></script>
</body>
</html>
