<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storefront — WhatsApp Business Platform</title>
<style>
:root {
  --primary: #25D366;
  --secondary: #128C7E;
  --accent: #075E54;
  --bg: #d8baba;
  --surface: #F0F2F5;
  --text: #0a151b;
  --text-light: #667781;
  --gradient: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
  --shadow: rgba(37, 211, 102, 0.2);
  --radius: 16px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: var(--transition);
}
/* ===== HEADER ===== */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--gradient);
  padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 20px var(--shadow);
}
.header-logo { display: flex; align-items: center; gap: 10px; }
.header-logo img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,0.3); }
.header-logo span { color: #fff; font-size: 20px; font-weight: 700; }
.header-actions { display: flex; gap: 10px; }
.header-btn {
  background: rgba(255,255,255,0.2); color: #fff; border: none;
  padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px;
  transition: var(--transition);
}
.header-btn:hover { background: rgba(255,255,255,0.35); transform: translateY(-1px); }
.cart-badge {
  position: absolute; top: -4px; right: -4px; background: #ff4458; color: #fff;
  border-radius: 50%; width: 20px; height: 20px; font-size: 11px;
  display: flex; align-items: center; justify-content: center; font-weight: 700;
}
/* ===== HERO ===== */
.hero {
  background: var(--gradient);
  padding: 40px 20px 60px;
  text-align: center;
  color: #fff;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: ''; position: absolute; bottom: -30px; left: 0; right: 0;
  height: 60px; background: var(--bg); border-radius: 50% 50% 0 0;
}
.hero h1 { font-size: 28px; margin-bottom: 8px; }
.hero p { font-size: 16px; opacity: 0.9; max-width: 400px; margin: 0 auto; }
.hero-search {
  margin-top: 20px; display: flex; max-width: 400px; margin-left: auto; margin-right: auto;
  background: #fff; border-radius: 30px; padding: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.hero-search input {
  flex: 1; border: none; outline: none; padding: 12px 20px; font-size: 15px;
  background: transparent; color: var(--text);
}
.hero-search button {
  background: var(--primary); color: #fff; border: none; padding: 10px 20px;
  border-radius: 25px; cursor: pointer; font-size: 14px; font-weight: 600;
}
/* ===== CATEGORIES ===== */
.categories {
  padding: 20px; display: flex; gap: 12px; overflow-x: auto;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.categories::-webkit-scrollbar { display: none; }
.cat-chip {
  background: var(--surface); color: var(--text); border: 2px solid transparent;
  padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 14px;
  font-weight: 600; white-space: nowrap; transition: var(--transition);
}
.cat-chip:hover { border-color: var(--primary); }
.cat-chip.active { background: var(--primary); color: #fff; }
/* ===== PRODUCT GRID ===== */
.products { padding: 10px 20px 100px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
.product-card {
  background: var(--bg); border-radius: var(--radius); overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08); transition: var(--transition);
  cursor: pointer; position: relative;
}
.product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px var(--shadow); }
.product-img {
  width: 100%; height: 140px; object-fit: cover; background: var(--surface);
}
.product-img-placeholder {
  width: 100%; height: 140px; display: flex; align-items: center; justify-content: center;
  font-size: 48px; background: var(--surface);
}
.product-info { padding: 12px; }
.product-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.product-desc { font-size: 12px; color: var(--text-light); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.product-price { font-size: 16px; font-weight: 700; color: var(--primary); }
.product-add {
  position: absolute; bottom: 12px; right: 12px;
  background: var(--primary); color: #fff; border: none;
  width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
  font-size: 20px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 10px var(--shadow); transition: var(--transition);
}
.product-add:hover { transform: scale(1.15); }
.product-add:active { transform: scale(0.9); }
.product-unavailable { opacity: 0.5; }
.product-unavailable .product-add { display: none; }
/* ===== CART DRAWER ===== */
.cart-drawer {
  position: fixed; top: 0; right: -400px; width: 380px; max-width: 100vw;
  height: 100vh; background: var(--bg); z-index: 200;
  box-shadow: -4px 0 30px rgba(0,0,0,0.2); transition: right 0.3s ease;
  display: flex; flex-direction: column;
}
.cart-drawer.open { right: 0; }
.cart-overlay {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.5); z-index: 150; opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
}
.cart-overlay.show { opacity: 1; pointer-events: auto; }
.cart-header {
  background: var(--gradient); color: #fff; padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.cart-header h3 { font-size: 18px; }
.cart-close { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
.cart-items { flex: 1; overflow-y: auto; padding: 16px 20px; }
.cart-item {
  display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--surface);
}
.cart-item-img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; background: var(--surface); }
.cart-item-info { flex: 1; }
.cart-item-name { font-size: 14px; font-weight: 600; }
.cart-item-price { font-size: 13px; color: var(--primary); font-weight: 700; }
.cart-qty { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.qty-btn {
  background: var(--surface); border: none; width: 28px; height: 28px;
  border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 700;
}
.qty-btn:hover { background: var(--primary); color: #fff; }
.cart-item-remove { color: #ff4458; background: none; border: none; cursor: pointer; font-size: 13px; }
.cart-empty { text-align: center; padding: 40px 20px; color: var(--text-light); }
.cart-empty-icon { font-size: 48px; margin-bottom: 12px; }
.cart-footer { padding: 16px 20px; border-top: 1px solid var(--surface); }
.cart-total { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 16px; }
.cart-total strong { color: var(--primary); font-size: 20px; }
.cart-checkout {
  width: 100%; background: var(--gradient); color: #fff; border: none;
  padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: var(--transition);
}
.cart-checkout:hover { transform: translateY(-2px); box-shadow: 0 4px 20px var(--shadow); }
.cart-checkout:disabled { opacity: 0.5; cursor: not-allowed; }
/* ===== CHECKOUT MODAL ===== */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.6); z-index: 300; display: none;
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg); border-radius: 20px; padding: 24px;
  max-width: 400px; width: 100%; max-height: 90vh; overflow-y: auto;
}
.modal h2 { font-size: 22px; margin-bottom: 16px; text-align: center; }
.modal-field { margin-bottom: 14px; }
.modal-field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--text-light); }
.modal-field input, .modal-field textarea, .modal-field select {
  width: 100%; padding: 12px 16px; border: 2px solid var(--surface);
  border-radius: 12px; font-size: 15px; outline: none; transition: var(--transition);
}
.modal-field input:focus, .modal-field textarea:focus { border-color: var(--primary); }
.modal-order-summary { background: var(--surface); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
.modal-order-summary h4 { font-size: 14px; margin-bottom: 8px; }
.modal-order-item { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; }
.modal-submit {
  width: 100%; background: var(--gradient); color: #fff; border: none;
  padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700;
  cursor: pointer; margin-top: 8px;
}
.modal-submit:hover { transform: translateY(-2px); box-shadow: 0 4px 20px var(--shadow); }
/* ===== FLOATING WHATSAPP BUTTON ===== */
.wa-float {
  position: fixed; bottom: 20px; right: 20px; z-index: 90;
  background: #25D366; color: #fff; border: none; width: 56px; height: 56px;
  border-radius: 50%; font-size: 28px; cursor: pointer;
  box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4); transition: var(--transition);
  display: flex; align-items: center; justify-content: center;
}
.wa-float:hover { transform: scale(1.1); }
/* ===== TOAST ===== */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--text); color: #fff; padding: 12px 24px; border-radius: 30px;
  font-size: 14px; z-index: 400; opacity: 0; transition: all 0.3s;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
/* ===== LOADING ===== */
.loader { text-align: center; padding: 60px 20px; }
.loader-spinner {
  width: 40px; height: 40px; border: 4px solid var(--surface);
  border-top-color: var(--primary); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .hero h1 { font-size: 22px; }
  .products { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .product-img, .product-img-placeholder { height: 110px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-logo">
    <img id="bizLogo" src="" alt="Logo" onerror="this.style.display='none'">
    <span id="bizName">My Store</span>
  </div>
  <div class="header-actions">
    <button class="header-btn" onclick="openCart()" style="position:relative">
      🛒 Cart <span class="cart-badge" id="cartBadge" style="display:none">0</span>
    </button>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <h1 id="heroTitle">Welcome!</h1>
  <p id="heroDesc">Browse our catalog and order on WhatsApp</p>
  <div class="hero-search">
    <input type="text" id="searchInput" placeholder="Search products..." oninput="filterProducts()">
    <button onclick="filterProducts()">🔍</button>
  </div>
</div>

<!-- CATEGORIES -->
<div class="categories" id="categoryBar"></div>

<!-- PRODUCTS -->
<div class="products" id="productGrid">
  <div class="loader">
    <div class="loader-spinner"></div>
    <p>Loading catalog...</p>
  </div>
</div>

<!-- CART DRAWER -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h3>🛒 Your Cart</h3>
    <button class="cart-close" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total:</span>
      <strong id="cartTotal">₹0</strong>
    </div>
    <button class="cart-checkout" id="checkoutBtn" onclick="openCheckout()" disabled>Checkout via WhatsApp</button>
  </div>
</div>

<!-- CHECKOUT MODAL -->
<div class="modal-overlay" id="checkoutModal">
  <div class="modal">
    <h2>📋 Order Details</h2>
    <div class="modal-order-summary" id="orderSummary"></div>
    <div class="modal-field">
      <label>Your Name</label>
      <input type="text" id="custName" placeholder="Enter your name">
    </div>
    <div class="modal-field">
      <label>Phone Number</label>
      <input type="tel" id="custPhone" placeholder="98765 43210">
    </div>
    <div class="modal-field">
      <label>Delivery Address</label>
      <textarea id="custAddress" rows="2" placeholder="Full address"></textarea>
    </div>
    <div class="modal-field">
      <label>Payment Method</label>
      <select id="paymentMethod">
        <option value="cash">Cash on Delivery</option>
        <option value="upi">UPI / PhonePe / GPay</option>
        <option value="card">Card</option>
      </select>
    </div>
    <div class="modal-field">
      <label>Notes (optional)</label>
      <input type="text" id="orderNotes" placeholder="Special instructions...">
    </div>
    <button class="modal-submit" onclick="placeOrder()">📱 Place Order on WhatsApp</button>
  </div>
</div>

<!-- FLOATING WHATSAPP -->
<button class="wa-float" onclick="contactWhatsApp()" title="Chat on WhatsApp">💬</button>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ===== STATE =====
let businessId = new URLSearchParams(window.location.search).get('biz') || 'demo123';
let allProducts = [];
let cart = [];
let activeCategory = '';

const API = window.location.origin.replace(/:\d+$/, '') + ':8000';

// ===== INIT =====
async function init() {
  try {
    // Load business profile
    const profileRes = await fetch(`${API}/api/business/${businessId}`);
    if (profileRes.ok) {
      const profile = await profileRes.json();
      applyBranding(profile);
    }
    // Load catalog
    const catRes = await fetch(`${API}/api/business/${businessId}/categories`);
    if (catRes.ok) {
      const data = await catRes.json();
      renderCategories(data.categories || []);
    }
    const prodRes = await fetch(`${API}/api/business/${businessId}/catalog`);
    if (prodRes.ok) {
      const data = await prodRes.json();
      allProducts = data.items || [];
      renderProducts(allProducts);
    } else {
      // Demo mode with sample products
      loadDemoProducts();
    }
  } catch (e) {
    console.error('Init error:', e);
    loadDemoProducts();
  }
}

function applyBranding(profile) {
  document.getElementById('bizName').textContent = profile.name || 'My Store';
  document.getElementById('heroTitle').textContent = profile.name || 'Welcome!';
  document.getElementById('heroDesc').textContent = profile.description || 'Browse our catalog and order on WhatsApp';
  if (profile.logo_url) {
    document.getElementById('bizLogo').src = profile.logo_url;
  }
  if (profile.primary_color) {
    document.documentElement.style.setProperty('--primary', profile.primary_color);
    document.documentElement.style.setProperty('--secondary', profile.secondary_color || profile.primary_color);
    document.documentElement.style.setProperty('--gradient', `linear-gradient(135deg, ${profile.primary_color} 0%, ${profile.secondary_color || profile.primary_color} 100%)`);
    document.documentElement.style.setProperty('--shadow', profile.primary_color + '33');
  }
  document.title = profile.name || 'Storefront';
}

// ===== CATEGORIES =====
function renderCategories(cats) {
  const bar = document.getElementById('categoryBar');
  bar.innerHTML = `<button class="cat-chip active" onclick="selectCategory('')">All</button>` +
    cats.map(c => `<button class="cat-chip" onclick="selectCategory('${c}')">${c}</button>`).join('');
}

function selectCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  filterProducts();
}

// ===== PRODUCTS =====
function renderProducts(items) {
  const grid = document.getElementById('productGrid');
  if (items.length === 0) {
    grid.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light)"><p style="font-size:48px">📦</p><p>No products found</p></div>';
    return;
  }
  grid.innerHTML = items.map(item => `
    <div class="product-card ${!item.is_available ? 'product-unavailable' : ''}" onclick="addToCart('${item.id}')">
      ${item.image_url
        ? `<img class="product-img" src="${item.image_url}" alt="${item.name}" onerror="this.outerHTML='<div class=\\'product-img-placeholder\\'>📦</div>'">`
        : `<div class="product-img-placeholder">${getCategoryIcon(item.category)}</div>`
      }
      <div class="product-info">
        <div class="product-name">${item.name}</div>
        <div class="product-desc">${item.description || ''}</div>
        <div class="product-price">₹${item.price}</div>
      </div>
      ${item.is_available ? `<button class="product-add" onclick="event.stopPropagation();addToCart('${item.id}')">+</button>` : '<div style="position:absolute;bottom:12px;right:12px;color:#999;font-size:12px">Out of stock</div>'}
    </div>
  `).join('');
}

function getCategoryIcon(cat) {
  const icons = { 'Starters':'🥗', 'Main Course':'🍛', 'Breads':'🫓', 'Rice & Biryani':'🍚', 'Desserts':'🍰', 'Beverages':'🥤',
    'Single Room':'🛏️', 'Double Room':'🛏️', 'Suite':'🏨', 'Deluxe Room':'🏨', 'Family Room':'👨‍👩‍👧‍👦',
    'General Medicine':'💊', 'Pediatrics':'👶', 'Cardiology':'❤️', 'Orthopedics':'🦴', 'Dental':'🦷', 'Eye':'👁️', 'Skin':'🧴',
    'ITR Filing':'📊', 'GST Return':'🧾', 'TDS Return':'📝', 'Audit':'🔍', 'Company Registration':'🏢',
    'Property':'🏠', 'Divorce':'⚖️', 'Criminal':'🔒', 'Corporate':'💼', 'Civil':'📜', 'Family':'👨‍👩‍👧',
    'Haircut':'💇', 'Facial':'✨', 'Massage':'💆', 'Manicure':'💅', 'Pedicure':'🦶', 'Bridal Package':'👰',
    'Electronics':'📱', 'Clothing':'👕', 'Groceries':'🛒', 'Home & Kitchen':'🍳', 'Beauty':'💄', 'Toys':'🧸',
  };
  return icons[cat] || '📦';
}

function filterProducts() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let filtered = allProducts;
  if (activeCategory) filtered = filtered.filter(p => p.category === activeCategory);
  if (search) filtered = filtered.filter(p => p.name.toLowerCase().includes(search) || (p.description || '').toLowerCase().includes(search));
  renderProducts(filtered);
}

// ===== DEMO PRODUCTS =====
function loadDemoProducts() {
  allProducts = [
    { id: 'd1', category: 'Starters', name: 'Paneer Tikka', description: 'Grilled cottage cheese with spices', price: 180, is_available: true, image_url: '' },
    { id: 'd2', category: 'Starters', name: 'Chicken 65', description: 'Spicy fried chicken', price: 220, is_available: true, image_url: '' },
    { id: 'd3', category: 'Main Course', name: 'Butter Chicken', description: 'Creamy tomato curry', price: 280, is_available: true, image_url: '' },
    { id: 'd4', category: 'Main Course', name: 'Paneer Butter Masala', description: 'Rich paneer curry', price: 240, is_available: true, image_url: '' },
    { id: 'd5', category: 'Breads', name: 'Butter Naan', description: 'Soft tandoor bread', price: 40, is_available: true, image_url: '' },
    { id: 'd6', category: 'Rice & Biryani', name: 'Chicken Biryani', description: 'Aromatic basmati rice with chicken', price: 220, is_available: true, image_url: '' },
    { id: 'd7', category: 'Desserts', name: 'Gulab Jamun', description: 'Sweet milk dumplings', price: 60, is_available: true, image_url: '' },
    { id: 'd8', category: 'Beverages', name: 'Masala Chai', description: 'Indian spiced tea', price: 25, is_available: true, image_url: '' },
  ];
  renderCategories(['Starters', 'Main Course', 'Breads', 'Rice & Biryani', 'Desserts', 'Beverages']);
  renderProducts(allProducts);
  document.getElementById('bizName').textContent = 'Spice Garden Restaurant';
  document.getElementById('heroTitle').textContent = 'Spice Garden 🍽️';
  document.getElementById('heroDesc').textContent = 'Authentic Indian cuisine. Order now on WhatsApp!';
}

// ===== CART =====
function addToCart(id) {
  const item = allProducts.find(p => p.id === id);
  if (!item) return;
  const existing = cart.find(c => c.id === id);
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ ...item, qty: 1 });
  }
  updateCart();
  showToast(`✅ ${item.name} added to cart`);
}

function removeFromCart(id) {
  cart = cart.filter(c => c.id !== id);
  updateCart();
}

function changeQty(id, delta) {
  const item = cart.find(c => c.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) removeFromCart(id);
  updateCart();
}

function updateCart() {
  const badge = document.getElementById('cartBadge');
  const count = cart.reduce((s, c) => s + c.qty, 0);
  badge.textContent = count;
  badge.style.display = count > 0 ? 'flex' : 'none';

  const itemsEl = document.getElementById('cartItems');
  if (cart.length === 0) {
    itemsEl.innerHTML = '<div class="cart-empty"><div class="cart-empty-icon">🛒</div><p>Your cart is empty</p><p style="font-size:13px;margin-top:8px">Add items to get started!</p></div>';
  } else {
    itemsEl.innerHTML = cart.map(c => `
      <div class="cart-item">
        <div class="cart-item-img">${getCategoryIcon(c.category)}</div>
        <div class="cart-item-info">
          <div class="cart-item-name">${c.name}</div>
          <div class="cart-item-price">₹${c.price} × ${c.qty} = ₹${c.price * c.qty}</div>
          <div class="cart-qty">
            <button class="qty-btn" onclick="changeQty('${c.id}', -1)">−</button>
            <span>${c.qty}</span>
            <button class="qty-btn" onclick="changeQty('${c.id}', 1)">+</button>
            <button class="cart-item-remove" onclick="removeFromCart('${c.id}')">Remove</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  const total = cart.reduce((s, c) => s + c.price * c.qty, 0);
  document.getElementById('cartTotal').textContent = `₹${total}`;
  document.getElementById('checkoutBtn').disabled = cart.length === 0;
}

function openCart() {
  document.getElementById('cartDrawer').classList.add('open');
  document.getElementById('cartOverlay').classList.add('show');
}

function closeCart() {
  document.getElementById('cartDrawer').classList.remove('open');
  document.getElementById('cartOverlay').classList.remove('show');
}

// ===== CHECKOUT =====
function openCheckout() {
  const summary = document.getElementById('orderSummary');
  const subtotal = cart.reduce((s, c) => s + c.price * c.qty, 0);
  const tax = Math.round(subtotal * 0.05 * 100) / 100;
  const total = subtotal + tax;
  summary.innerHTML = `
    <h4>Order Summary</h4>
    ${cart.map(c => `<div class="modal-order-item"><span>${c.name} × ${c.qty}</span><span>₹${c.price * c.qty}</span></div>`).join('')}
    <div class="modal-order-item" style="margin-top:8px;border-top:1px solid #ddd;padding-top:8px"><span>Subtotal</span><span>₹${subtotal}</span></div>
    <div class="modal-order-item"><span>Tax (5%)</span><span>₹${tax}</span></div>
    <div class="modal-order-item" style="font-weight:700"><span>Total</span><span>₹${total}</span></div>
  `;
  document.getElementById('checkoutModal').classList.add('show');
  closeCart();
}

function placeOrder() {
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  const payment = document.getElementById('paymentMethod').value;
  const notes = document.getElementById('orderNotes').value.trim();

  if (!name || !phone) {
    showToast('⚠️ Please enter name and phone');
    return;
  }

  const subtotal = cart.reduce((s, c) => s + c.price * c.qty, 0);
  const tax = Math.round(subtotal * 0.05 * 100) / 100;
  const total = subtotal + tax;

  // Build WhatsApp message
  let msg = `*New Order* 📋\n\n`;
  msg += `*Customer:* ${name}\n`;
  msg += `*Phone:* ${phone}\n`;
  msg += `*Address:* ${address || 'Pickup'}\n\n`;
  msg += `*Items:*\n`;
  cart.forEach(c => { msg += `• ${c.name} × ${c.qty} = ₹${c.price * c.qty}\n`; });
  msg += `\n*Subtotal:* ₹${subtotal}\n`;
  msg += `*Tax:* ₹${tax}\n`;
  msg += `*Total:* ₹${total}\n\n`;
  msg += `*Payment:* ${payment.toUpperCase()}\n`;
  if (notes) msg += `*Notes:* ${notes}\n`;

  // Open WhatsApp
  const waUrl = `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(waUrl, '_blank');

  // Also save order via API
  fetch(`${API}/api/business/${businessId}/order/create`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      customer_name: name,
      customer_phone: phone,
      items: cart.map(c => ({ item_id: c.id, name: c.name, qty: c.qty, price: c.price })),
      delivery_address: address,
      payment_method: payment,
      notes: notes,
    })
  }).catch(e => console.error('Order save error:', e));

  // Clear cart
  cart = [];
  updateCart();
  document.getElementById('checkoutModal').classList.remove('show');
  showToast('✅ Order placed! Check WhatsApp to confirm');
}

function contactWhatsApp() {
  window.open('https://wa.me/', '_blank');
}

// ===== TOAST =====
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ===== START =====
init();
</script>
</body>
</html>
