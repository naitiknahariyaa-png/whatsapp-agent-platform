services:
  - type: web
    name: whatsapp-agent-platform
    env: python
    buildCommand: pip install -r agent-engine/requirements.txt
    startCommand: cd agent-engine && python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: JWT_SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FIGMA_API_TOKEN
        sync: false
      - key: FIGMA_FILE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: WA_BRIDGE_SECRET
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false

  - type: web
    name: whatsapp-agent-bridge
    env: node
    plan: starter
    buildCommand: cd whatsapp-bridge && npm install
    startCommand: cd whatsapp-bridge && node bridge.js
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_URL
        value: https://whatsapp-agent-platform-1.onrender.com
      - key: WS_PORT
        value: 3002
      - key: HTTP_PORT
        value: 3001
      - key: WA_BRIDGE_SECRET
        sync: false
    disk:
      name: whatsapp-bridge-data
      mountPath: /opt/render/project/src/whatsapp-bridge
      sizeGB: 1
