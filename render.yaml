services:
  - type: web
    name: whatsapp-agent-platform
    env: python
    buildCommand: pip install -r agent-engine/requirements.txt
    startCommand: cd agent-engine && python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama3-70b-8192
      - key: CHROMA_HOST
        value: localhost
      - key: CHROMA_PORT
        value: 8000