global:
  resolve_timeout: 5m
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@whatsapp-agent.local'
  smtp_auth_username: ''
  smtp_auth_password: ''

route:
  group_by: ['alertname', 'client_id']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'telegram'
  routes:
    - match:
        severity: 'critical'
      receiver: 'telegram-critical'
      continue: true
    - match:
        alertname: 'bridge_down'
      receiver: 'telegram-critical'

receivers:
  - name: 'telegram'
    telegram_configs:
      - api_url: 'https://api.telegram.org'
        bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: '${TELEGRAM_ADMIN_CHAT_ID}'
        send_resolved: true
        message: |
          {{ range .Alerts }}
          🚨 [{{ .Labels.severity | upper }}] {{ .Labels.alertname }}
          {{ .Annotations.message }}
          Client: {{ .Labels.client_id }}
          Time: {{ .StartsAt }}
          {{ end }}

  - name: 'telegram-critical'
    telegram_configs:
      - api_url: 'https://api.telegram.org'
        bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: '${TELEGRAM_ADMIN_CHAT_ID}'
        send_resolved: true
        message: |
          {{ range .Alerts }}
          🔴 CRITICAL: {{ .Labels.alertname }}
          {{ .Annotations.message }}
          Client: {{ .Labels.client_id }}
          Time: {{ .StartsAt }}
          {{ end }}

  - name: 'email'
    email_configs:
      - to: 'ops@whatsapp-agent.local'
        send_resolved: true
        headers:
          subject: '[ALERT] {{ .GroupLabels.alertname }}'
        html: |
          {{ range .Alerts }}
          <h3>{{ .Labels.alertname }} [{{ .Labels.severity }}]</h3>
          <p>{{ .Annotations.message }}</p>
          <p><strong>Client:</strong> {{ .Labels.client_id }}</p>
          <p><strong>Time:</strong> {{ .StartsAt }}</p>
          <hr>
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'client_id']