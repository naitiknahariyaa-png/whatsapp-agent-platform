version: "3.8"

services:
  traefik:
    image: traefik:v3.0
    container_name: wap-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--api.dashboard=true"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
    restart: unless-stopped
    networks:
      - wap-internal

  postgres:
    image: postgres:16-alpine
    container_name: wap-postgres
    environment:
      POSTGRES_DB: wap_crm
      POSTGRES_USER: wap_user
      POSTGRES_PASSWORD: wap_pass_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - wap-internal

  redis:
    image: redis:7-alpine
    container_name: wap-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - wap-internal

  chroma:
    image: chromadb/chroma:latest
    container_name: wap-chroma
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma-data
    volumes:
      - chroma_data:/chroma/chroma-data
    restart: unless-stopped
    networks:
      - wap-internal

  agent-engine:
    build: ../agent-engine
    container_name: wap-agent
    environment:
      - DATABASE_URL=postgresql+asyncpg://wap_user:wap_pass_123@postgres:5432/wap_crm
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - LLM_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - postgres
      - redis
      - chroma
    restart: unless-stopped
    networks:
      - wap-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent-engine.rule=Host(`api.localhost`)"
      - "traefik.http.routers.agent-engine.entrypoints=web"
      - "traefik.http.routers.agent-engine.middlewares=agent-auth"
      - "traefik.http.middlewares.agent-auth.basicauth.users=admin:$$apr1$$H6e6B6$$9YQnZQZQZQZQZQZQZQZQZ/"

  calendar-service:
    image: calcom/cal.com:latest
    container_name: wap-calendar
    environment:
      - DATABASE_URL=postgresql://wap_user:wap_pass_123@postgres:5432/wap_crm
      - NEXTAUTH_URL=http://calendar.localhost
      - NEXT_PUBLIC_WEBAPP_URL=http://calendar.localhost
      - CAL_DB_HOST=postgres
      - CAL_DB_USER=wap_user
      - CAL_DB_PASSWORD=wap_pass_123
      - CAL_DB_NAME=wap_crm
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - wap-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.calendar.rule=Host(`calendar.localhost`)"
      - "traefik.http.routers.calendar.entrypoints=web"

networks:
  wap-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  traefik_letsencrypt: