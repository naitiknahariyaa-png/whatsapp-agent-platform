[project]
name = "whatsapp-agent-platform"
version = "1.0.0"
description = "WhatsApp Agent Platform - Terminal Edition"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "uvloop>=0.21.0",
    "httpx==0.28.1",
    "sqlalchemy==2.0.51",
    "aiosqlite==0.19.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    "langchain>=0.3.0",
    "langchain-groq>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=0.2.0",
    "python-dotenv==1.0.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "chromadb>=0.4.0",
    "sentence-transformers==2.2.2",
    "PyMuPDF==1.23.8",
    "python-multipart==0.0.6",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "passlib[bcrypt]>=1.7.4",
    "qrcode[pil]>=7.4.0",
    "orjson>=3.10.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent-engine", "services"]

[tool.uvicorn]
workers = 4
loop = "uvloop"
http = "httptools"
no-access-log = true
log-level = "info"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["agent-engine/tests", "services/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
plugins = ["pydantic"]
